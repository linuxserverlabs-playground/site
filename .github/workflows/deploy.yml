# Build the main site's code in Labs mode from the Labs hub and publish it to this repository's Pages from the gh-pages
# branch (the main site's deploy-run.yml). The data snapshots are this repository's data branch. Only the Labs control
# plane starts it, on its slots (control's deploys.py), and once a day with `refresh_all`.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: Refetch every retained build from the hub
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: linuxserver-playground/site/.github/workflows/deploy-run.yml@main
    with:
      mode: labs
      refresh_all: ${{ inputs.refresh_all }}
